<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character Sheet: $name</title>
    <style>
        :root {
            --paper: #f6f0e6;
            --paper-dark: #e6dcc5;
            --ink: #1f1d1a;
            --muted: #505966;
            --accent: #46566c;
            --accent-soft: #b7c1ce;
            --panel: #fffdf9;
            --border: #b3bdc8;
            --shadow: rgba(0, 0, 0, 0.35);
            --name-red: #a3212b;
        }

        * { box-sizing: border-box; }

        html {
            min-height: 100%;
            background: #252c36;
        }

        body {
            max-width: 900px;
            margin: 2rem auto;
            padding: 1.25rem;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.2), rgba(0,0,0,0.02)),
                repeating-linear-gradient(
                    0deg,
                    var(--paper),
                    var(--paper) 24px,
                    #f2eadd 24px,
                    #f2eadd 25px
                );
            border: 1px solid #536171;
            border-radius: 14px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        h1 {
            margin: 0 0 1.25rem;
            padding: 0.75rem 1rem;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--name-red);
            background: linear-gradient(180deg, #f8f1e4, #ece0ca);
            border: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        section {
            margin: 1.25rem 0;
            padding: 1rem 1.1rem 1.2rem;
            background: rgba(255, 253, 249, 0.9);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(42, 30, 18, 0.04);
        }

        h2, h4 {
            margin: 0 0 0.8rem;
            color: var(--accent);
            font-family: "Palatino Linotype", "Book Antiqua", "URW Chancery L", serif;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-soft);
            padding-bottom: 0.35rem;
        }

        h4 {
            font-size: 1rem;
            margin-bottom: 0.6rem;
        }

        p, li {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--ink);
        }

        p {
            margin: 0;
        }

        ul {
            margin: 0.25rem 0 0;
            padding-left: 1.2rem;
        }

        li {
            margin: 0.4rem 0;
        }

        ul.horizontal-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 0.8rem;
            padding: 0;
            margin: 0;
        }

        ul.horizontal-list li {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0.45rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: linear-gradient(180deg, #f4ead8, #ead9b8);
            color: var(--ink);
            font-weight: 600;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        section p:last-child,
        section ul:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <h1>$name</h1>
    <section>
        <h2>Description</h2>
        <p>$description</p>
    </section>
    <section>
        <h2>Stats</h2>
        <ul class="horizontal-list">$stats_html</ul>
    </section>
    <section>
        <h4>Status</h4>
        <p>$status</p>
    </section>
    <section>
        <h2>Equipped Items</h2>
        <ul>$equipped_html</ul>
    </section>
    <section>
        <h2>Inventory</h2>
        <ul>$inventory_html</ul>
    </section>
    <section>
        <h2>Currency</h2>
        <p>$currency</p>
    </section>
</body>
</html>
